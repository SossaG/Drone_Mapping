%YAML:1.0
#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------

Camera.type: "PinHole"

Camera.fx: 462.698105
Camera.fy: 456.817400
Camera.cx: 354.636361
Camera.cy: 245.892197

# distortion parameters
Camera.k1: 0.162047
Camera.k2: -0.133637
Camera.p1: 0.001451
Camera.p2: 0.032530
Camera.k3: 0.000000

# Camera original resolution
Camera.width: 640
Camera.height: 480

# Camera frames per second
Camera.fps: 7.0   # keep or set to your actual rate (e.g., 30.0)

# Camera.bf: 40.0  # Set based on your baseline

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# ThDepth: 40.0
# DepthMapFactor: 1.0

# IMU block (types that ORB-SLAM3 expects)
IMU.InsertKFsWhenLost: 0

IMU.NoiseGyro:  0.002     # ok as float
IMU.NoiseAcc:   0.03      # ok as float
IMU.GyroWalk:   0.0001    # ok as float
IMU.AccWalk:    0.001     # ok as float
IMU.Frequency:  100       # <-- MUST be an integer (no quotes, no decimal)
#IMU.g:          9.81      # ok as float CHAT GAVE ME THIS ONE WHICH I BELIEVE DIDNT ERROR SO MAYBE TRY AFTER

# Camera (optical) -> IMU (body) transform used by ORB-SLAM3
#the following is my own measured transform of the cam to imu when placed to the right of my touchpad
Tbc: !!opencv-matrix     #CHAT GAVE ME THIS ONE WHICH I BELIEVE DIDNT ERROR SO MAYBE TRY AFTER
  rows: 4
  cols: 4
  dt: f
  data: [
     0, -1,  0,  0.12,
     0,  0, -1, -0.18,
     1,  0,  0, -0.16,
     0,  0,  0,  1.0]






#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 500 #1000

# ORB Extractor: Scale factor between levels in the scale pyramid 
ORBextractor.scaleFactor: 1.2 #1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8 #8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast
ORBextractor.iniThFAST: 15 #20
ORBextractor.minThFAST: 4 #7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0